    <rect x="2"  y="4"  width="2" height="8"/>
    <rect x="3"  y="11" width="2" height="2"/>
    <rect x="4"  y="12" width="6" height="2"/>
    <rect x="10" y="3"  width="2" height="2"/>
    <rect x="10" y="11" width="2" height="2"/>
